[package]
name = "jamsys-helper"
version = "1.0.0"
edition = "2021"
description = "Minimal privileged reader for JamSys (RAPL energy and NVMe SMART)"
license = "MIT"

[[bin]]
name = "jamsys-helper"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
