[package]
name = "jamsysd"
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Lightweight local system-health monitor for Linux laptops"
license = "MIT"

[[bin]]
name = "jamsysd"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
toml = { version = "0.8", default-features = false, features = ["parse", "display"] }

[profile.release]
opt-level = "z"      # size: this is a background daemon, not a hot loop
lto = true
codegen-units = 1
panic = "unwind"     # required: collectors are isolated with catch_unwind
strip = true

[lib]
name = "jamsys"
path = "src/lib.rs"
